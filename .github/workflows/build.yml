name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build and self-tests (Windows)
        if: runner.os == 'Windows'
        run: ./gradlew.bat --no-daemon build selfTest quickGuiSmoke
      - name: Build and self-tests (Linux)
        if: runner.os == 'Linux'
        run: bash ./gradlew --no-daemon build selfTest && xvfb-run -a bash ./gradlew --no-daemon quickGuiSmoke
      - name: Package and hash verified build
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-release.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Windows'
        with:
          name: modchecker-verified
          path: build/release/*/*
          if-no-files-found: error
          retention-days: 14

name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Verify build and GUI
        run: ./gradlew.bat --no-daemon build selfTest quickGuiSmoke
      - name: Verify tag and package
        shell: pwsh
        run: ./scripts/package-release.ps1 -ExpectedTag $env:GITHUB_REF_NAME
      - name: Publish new release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseVersion = $env:GITHUB_REF_NAME.Substring(1)
          $assets = @(Get-ChildItem -LiteralPath "build/release/$releaseVersion" -File | ForEach-Object FullName)
          if ($assets.Count -ne 4) { throw 'Expected exactly four release files' }
          gh release create $env:GITHUB_REF_NAME @assets --repo $env:GITHUB_REPOSITORY --verify-tag --title "ModChecker $releaseVersion" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed; existing releases are never overwritten' }
      - name: Verify public download checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseVersion = $env:GITHUB_REF_NAME.Substring(1)
          $releaseDir = "build/release/$releaseVersion"
          foreach ($line in Get-Content -LiteralPath "$releaseDir/SHA256SUMS.txt") {
            $expected, $name = $line -split '  ', 2
            $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/$name"
            $download = Join-Path $env:RUNNER_TEMP $name
            $verified = $false
            for ($attempt = 0; $attempt -lt 6; $attempt++) {
              try {
                Invoke-WebRequest -Uri $url -OutFile $download
                if ((Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash -ine $expected) { throw 'SHA-256 mismatch' }
                $verified = $true
                break
              } catch { if ($attempt -eq 5) { throw }; Start-Sleep -Seconds 10 }
            }
            if (-not $verified) { throw "Unverified release file: $name" }
          }
